name: Windows backup compatibility

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify API startup and backup compatibility
        run: >-
          python -m pytest -q
          tests/test_storage.py
          tests/test_backup_archive.py
          tests/test_backup_crypto.py
          tests/test_backup_restore.py
          tests/test_backup_runner.py
          tests/test_backup_scheduler.py
          tests/test_backup_snapshot.py
          tests/test_backup_live_postgres.py
